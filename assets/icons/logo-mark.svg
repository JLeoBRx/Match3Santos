  <rect x="45" y="50" width="30" height="30" rx="9" fill="url(#tile2)"/>
  <rect x="80" y="56" width="30" height="30" rx="9" fill="url(#tile)"/>
  <path d="M60 57v16M53 63.5h14" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="25" cy="71" r="6" fill="#fff" opacity=".85"/>
  <circle cx="95" cy="71" r="6" fill="#fff" opacity=".85"/>
  <path d="M60 92l2.6 6 6.4.6-4.8 4.2 1.4 6.2-5.6-3.3-5.6 3.3 1.4-6.2-4.8-4.2 6.4-.6z" fill="url(#gold)"/>
