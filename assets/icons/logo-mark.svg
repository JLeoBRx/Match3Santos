<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Marca do Match dos Santos: auréola dourada sobre três peças combinadas -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset=".45" stop-color="#ffcf5a"/>
      <stop offset="1" stop-color="#f08c2a"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b78cff"/>
      <stop offset="1" stop-color="#6a35d8"/>
    </linearGradient>
    <linearGradient id="tile2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb37a"/>
      <stop offset="1" stop-color="#ff6f61"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity=".9"/>
